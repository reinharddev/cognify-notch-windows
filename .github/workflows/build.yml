# Membangun installer Windows (NSIS) di server GitHub. Berjalan manual (Actions > Run workflow)
# atau saat tag v* didorong. Hasilnya diunggah sebagai artifact; rilis ke Releases dilakukan
# lewat skrip rilis, bukan dari sini.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: cognify-notch-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
