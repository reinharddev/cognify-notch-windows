[package]
name = "cognify-notch"
version = "0.1.0"
description = "Cognify Notch untuk Windows"
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "cognify_notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
dirs = "6"

[target.'cfg(windows)'.dependencies]
arboard = "3"
png = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Foundation", "Media_Control", "Networking_Connectivity", "Storage_Streams",
  "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Globalization", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Power",
  "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
